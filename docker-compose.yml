services:
  db:
    image: postgres:16-alpine
    container_name: cinema_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cinema_user
      POSTGRES_PASSWORD: cinema_pass
      POSTGRES_DB: cinema_db
    ports:
      # 5433 no host: a porta 5432 já é usada pelo PostgreSQL instalado no Windows.
      # Dentro da rede do Docker o Postgres continua na 5432.
      - '5433:5432'
    volumes:
      - cinema_db_data:/var/lib/postgresql/data
      # Scripts rodados só na criação do volume (cria o banco de testes)
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  # Interface web simples para inspecionar as tabelas sem sair do navegador
  adminer:
    image: adminer
    container_name: cinema_adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      - db

volumes:
  cinema_db_data:
