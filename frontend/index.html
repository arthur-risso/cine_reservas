<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Cine Aurora — Reserve sua poltrona</title>
        <meta
            name="description"
            content="Filmes em cartaz, calendário de sessões e escolha de poltrona em tempo real, com opções Normal, Semi-VIP e VIP."
        />
        <!-- Pinta a barra do navegador no celular com a cor da interface. -->
        <meta name="theme-color" content="#08090c" />
        <meta name="color-scheme" content="dark" />

        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

        <!--
            preconnect abre a conexão (DNS + TLS) com o servidor de fontes em
            paralelo ao download do HTML. Sem ele, o navegador só descobre que
            precisa falar com o Google Fonts depois de baixar e ler o CSS, e o
            texto fica com a fonte de fallback por mais tempo.

            `display=swap` mostra o texto na fonte do sistema imediatamente e
            troca quando a fonte definitiva chega — em vez de deixar a página
            em branco esperando.
        -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div id="root"></div>
        <noscript>
            <p style="padding: 2rem; font-family: sans-serif; color: #f4f2ee">
                Este site precisa de JavaScript para funcionar. Ative-o no seu navegador.
            </p>
        </noscript>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
